name: Build EXE

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish
        run: dotnet publish Droideck.csproj -c Release -o out

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Droideck
          path: out/Droideck.exe
          if-no-files-found: error

      - name: Publish EXE to Releases
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest out/Droideck.exe --title "Build ${{ github.run_number }}" --notes "Windows x64 exe. If Windows warns about an unrecognized app, click More info, then Run anyway." --target "${{ github.sha }}"
